[project]
name = "evolvebank"
version = "0.1.0"
description = "A self-evolving agent memory: distill reusable reasoning strategies from your agent's successes and failures, retrieve them at test time."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",
    "numpy",
]

[project.optional-dependencies]
eval = [
    "matplotlib",
]
local = [
    "sentence-transformers",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evolvebank*"]
